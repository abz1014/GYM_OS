# Railway service config for the GymOS API.
#
# Explicitly DOCKERFILE rather than letting Railway auto-detect. Its Nixpacks builder picks a .NET
# SDK from its own package set, and this solution targets net10.0 — if that SDK is not in the set the
# build fails with a version error that reads like a code problem. The Dockerfile pins the exact base
# images instead, so the build is the same everywhere and does not drift when the builder updates.
#
# You do NOT need Docker installed locally: Railway builds the image on its own infrastructure from
# this Dockerfile. Local Docker is only useful if you want to reproduce a build failure yourself.

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
# The web process only serves; it never touches the schema. Apply migrations with the pre-deploy
# command below so a redeploy cannot reshape the database as a side effect of restarting.
startCommand = "dotnet GymOS.API.dll"

# Runs once per deploy, before the new container takes traffic. `--migrate` applies pending
# migrations and exits (see Program.cs). Safe to run repeatedly: EF skips migrations already applied.
#
# ONE STRING, not an argv array. Railway's schema is `string | array with maxItems 1`, and the array's
# single element is a whole command LINE, not a token — so ["dotnet", "GymOS.API.dll", "--migrate"]
# fails the config parse with "Array must contain at most 1 element(s)" at Snapshot code, before the
# build even starts. The string form is used here because an array that can only ever hold one element
# communicates nothing and invites exactly that mistake again.
#
# Exec form, no shell: `&&`, `|` and `$VAR` do NOT expand here, which is the entire reason for the
# /bin/sh -c wrapper below. Without it, `&&` would be handed to `dotnet` as a literal argument.
#
# Seeding runs on EVERY deploy on purpose, and that is safe rather than reckless: DemoDataSeeder's
# first act is `if (await db.Tenants.IgnoreQueryFilters().AnyAsync()) return;`, so from the second
# deploy onward it logs "Demo data already present" and does nothing. The whole seed is one
# transaction, so a failure cannot leave a half-populated tenant that then fools that check.
#
# The alternative was a manual one-off command after the first deploy, which is a step someone has to
# know about and remember — and forgetting it produces a fully working site that nobody can log into,
# because migrations create tables and no users. Making a fresh database come up usable by itself is
# worth the no-op on later deploys.
#
# A seed failure blocks the release, same as a migration failure. That is correct: the demo is the
# product here, and shipping the app without its data would be shipping nothing.
# `--pilot` selects the seed profile that gives EVERY member a login (10 members and 2 trainers per
# branch — see SeedProfile and the README). The deployed instance is the one a person signs into by
# hand, and the 300-member sales profile links only two of its members to an account, so on this
# environment it is the wrong shape: most of the product cannot be reached from it at all.
#
# Changing this flag does NOT reshape the live database. The seeder still no-ops while a tenant
# exists, so the profile only decides what gets built the next time this points at an EMPTY database.
# Drop `--pilot` to go back to the sales dataset — and note that switching either way needs the
# database emptied first, which is a deliberate, manual act.
preDeployCommand = '/bin/sh -c "dotnet GymOS.API.dll --migrate && dotnet GymOS.API.dll --seed --pilot"'

# Railway probes this before routing traffic. The check verifies the database connection, so a
# container that starts but cannot reach Postgres is never marked healthy.
healthcheckPath = "/health"
healthcheckTimeout = 120

# The SignalR hubs and the fifteen Hangfire recurring jobs both assume a single always-on process.
# Scaling past one replica needs a Redis backplane for SignalR and Hangfire's distributed locks
# verified under contention — neither is set up, so this stays at one until that work is done.
numReplicas = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
